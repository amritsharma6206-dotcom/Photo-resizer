<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Govt Exam Photo & Signature Resizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 flex flex-col items-center">

  <header class="max-w-xl w-full text-center my-6">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-blue-700">Govt Exam Photo & Sign Resizer</h1>
    <p class="text-sm sm:text-base text-slate-600 mt-2">SSC, Railway, Banking व अन्य सरकारी फॉर्म के लिए फोटो/साइन सही KB में तुरंत सेट करें।</p>
  </header>

  <main class="max-w-xl w-full bg-white p-6 rounded-2xl shadow-md border border-slate-200">
    
    <div class="border-2 border-dashed border-blue-300 rounded-xl p-6 text-center hover:bg-blue-50 transition cursor-pointer" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="image/jpeg, image/png, image/jpg" class="hidden" onchange="handleFileSelect(event)">
      <svg class="w-12 h-12 mx-auto text-blue-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
      <p class="font-semibold text-slate-700">अपनी फोटो या सिग्नेचर चुनें</p>
      <p class="text-xs text-slate-500 mt-1">JPG, JPEG या PNG फाइल अपलोड करें</p>
    </div>

    <div id="controls" class="hidden mt-6 space-y-4">
      
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">प्रीसेट चुनें (Exam Format):</label>
        <select id="presetSelect" class="w-full p-2.5 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" onchange="applyPreset()">
          <option value="custom">कस्टम (अपनी मर्जी का साइज भरें)</option>
          <option value="ssc_photo">SSC Photo (20 KB - 50 KB)</option>
          <option value="ssc_sign">SSC Signature (10 KB - 20 KB)</option>
          <option value="rrb_photo">Railway RRB Photo (30 KB - 70 KB)</option>
          <option value="rrb_sign">Railway RRB Signature (10 KB - 30 KB)</option>
          <option value="ibps_photo">Banking / IBPS Photo (20 KB - 50 KB)</option>
          <option value="ibps_sign">Banking / IBPS Signature (10 KB - 20 KB)</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">टारगेट साइज (लगभग KB):</label>
          <input type="number" id="targetKb" value="35" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">क्वालिटी एडजस्ट:</label>
          <input type="range" id="qualityRange" min="0.1" max="1" step="0.05" value="0.8" class="w-full mt-2" oninput="processImage()">
        </div>
      </div>

      <div class="flex flex-col sm:flex-row items-center gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
        <img id="previewImg" class="max-h-40 max-w-[150px] object-contain rounded border bg-white shadow-sm" alt="Preview">
        <div class="text-sm space-y-1">
          <p class="text-slate-500">मूल साइज: <span id="origSize" class="font-bold text-slate-700">0 KB</span></p>
          <p class="text-slate-500">नया साइज: <span id="newSize" class="font-bold text-green-600">0 KB</span></p>
          <p class="text-slate-500">डायमेंशन: <span id="dimensions" class="font-bold text-slate-700">0 x 0 px</span></p>
        </div>
      </div>

      <button onclick="downloadImage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition">
        डाउनलोड करें (Download Resized Image)
      </button>

    </div>

  </main>

  <canvas id="canvas" class="hidden"></canvas>

  <script>
    let originalImage = new Image();
    let originalFileSizeKB = 0;
    let processedBlob = null;

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      originalFileSizeKB = (file.size / 1024).toFixed(1);
      document.getElementById('origSize').innerText = originalFileSizeKB + ' KB';

      const reader = new FileReader();
      reader.onload = function(event) {
        originalImage.onload = function() {
          document.getElementById('controls').classList.remove('hidden');
          processImage();
        };
        originalImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function applyPreset() {
      const preset = document.getElementById('presetSelect').value;
      const targetInput = document.getElementById('targetKb');

      if (preset === 'ssc_photo' || preset === 'ibps_photo') targetInput.value = 35;
      else if (preset === 'ssc_sign' || preset === 'ibps_sign') targetInput.value = 15;
      else if (preset === 'rrb_photo') targetInput.value = 45;
      else if (preset === 'rrb_sign') targetInput.value = 20;

      autoAdjustToTarget();
    }

    function processImage(quality = null) {
      if (!originalImage.src) return;

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const q = quality !== null ? quality : parseFloat(document.getElementById('qualityRange').value);

      canvas.width = originalImage.width;
      canvas.height = originalImage.height;
      ctx.drawImage(originalImage, 0, 0);

      canvas.toBlob(function(blob) {
        processedBlob = blob;
        const currentSizeKB = (blob.size / 1024).toFixed(1);
        document.getElementById('newSize').innerText = currentSizeKB + ' KB';
        document.getElementById('dimensions').innerText = `${canvas.width} x ${canvas.height} px`;
        document.getElementById('previewImg').src = URL.createObjectURL(blob);
      }, 'image/jpeg', q);
    }

    function autoAdjustToTarget() {
      const targetKB = parseFloat(document.getElementById('targetKb').value);
      let minQ = 0.05, maxQ = 0.95, bestQ = 0.8;
      
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = originalImage.width;
      canvas.height = originalImage.height;
      ctx.drawImage(originalImage, 0, 0);

      for (let i = 0; i < 6; i++) {
        let midQ = (minQ + maxQ) / 2;
        let dataUrl = canvas.toDataURL('image/jpeg', midQ);
        let approxKb = (dataUrl.length * (3/4)) / 1024;

        if (approxKb > targetKB) {
          maxQ = midQ;
        } else {
          minQ = midQ;
          bestQ = midQ;
        }
      }

      document.getElementById('qualityRange').value = bestQ.toFixed(2);
      processImage(bestQ);
    }

    function downloadImage() {
      if (!processedBlob) return;
      const link = document.createElement('a');
      link.href = URL.createObjectURL(processedBlob);
      link.download = 'resized_exam_photo.jpg';
      link.click();
    }
  </script>
</body>
</html>
